name: Release

# Publishes packages/dotmorph to npm when a GitHub release is published
# (tag it vX.Y.Z to match packages/dotmorph/package.json).
#
# Uses npm trusted publishing (OpenID Connect): no npm token is stored in
# GitHub, and npm attaches a provenance statement linking the package to this
# workflow run. One-time setup on npmjs.com, after the package exists:
# package settings -> Trusted publishing -> GitHub Actions,
# repository shniii/dotmorph, workflow release.yml, environment npm.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Create this environment in the repository settings with a required
    # reviewer and a deployment rule limited to tags matching v*.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in the job that can mint a publish credential.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./packages/dotmorph/package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Release tag $TAG does not match package version $VERSION" >&2
            exit 1
          fi
      # Lifecycle scripts stay off while this job holds id-token: write.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build:lib
      - run: npm run lint:package
      - name: Publish (trusted publishing, provenance)
        run: npm publish -w dotmorph --access public --ignore-scripts
